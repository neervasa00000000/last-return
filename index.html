<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Last Return</title>
<meta name="description" content="The video shop closes at nine.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0B1418;
    --teal:#14262C;
    --rust:#C2612B;
    --cream:#E9DCC3;
    --crt:#86B3C4;
    --display:"Anton","Haettenschweiler","Arial Narrow",sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  }

  *{box-sizing:border-box;margin:0;padding:0}

  html,body{height:100%}

  body{
    background:var(--ink);
    color:var(--cream);
    font-family:var(--mono);
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
  }

  .stage{
    position:relative;
    height:100dvh;
    width:100%;
    overflow:hidden;
    display:grid;
    grid-template-rows:auto 1fr auto;
  }

  /* ---------- image plate ---------- */
  .plate{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    object-position:50% 45%;
    filter:saturate(0.92) contrast(1.04);
    z-index:0;
  }

  .veil{
    position:absolute;
    inset:0;
    z-index:1;
    pointer-events:none;
    background:
      radial-gradient(120% 90% at 50% 30%, rgba(11,20,24,0) 20%, rgba(11,20,24,.55) 70%, rgba(11,20,24,.9) 100%),
      linear-gradient(to top, rgba(11,20,24,.94) 0%, rgba(11,20,24,.5) 34%, rgba(11,20,24,0) 62%);
  }

  .scan{
    position:absolute;
    inset:0;
    z-index:3;
    pointer-events:none;
    opacity:.28;
    background:repeating-linear-gradient(
      to bottom,
      rgba(0,0,0,.5) 0px,
      rgba(0,0,0,.5) 1px,
      rgba(0,0,0,0) 1px,
      rgba(0,0,0,0) 3px
    );
  }

  .grain{
    position:absolute;
    inset:-50%;
    z-index:4;
    pointer-events:none;
    opacity:.13;
    mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>");
    animation:drift 700ms steps(2,end) infinite;
  }

  @keyframes drift{
    0%{transform:translate(0,0)}
    50%{transform:translate(-2%,1.5%)}
    100%{transform:translate(1.5%,-1%)}
  }

  /* ---------- signature: VHS tracking sweep ---------- */
  .track{
    position:absolute;
    left:-4%;
    width:108%;
    height:74px;
    z-index:5;
    pointer-events:none;
    top:0;
    opacity:0;
    backdrop-filter:brightness(1.5) saturate(.55) blur(.6px);
    -webkit-backdrop-filter:brightness(1.5) saturate(.55) blur(.6px);
    background:repeating-linear-gradient(
      to bottom,
      rgba(233,220,195,.10) 0px,
      rgba(233,220,195,.10) 2px,
      rgba(0,0,0,.14) 2px,
      rgba(0,0,0,.14) 5px
    );
    animation:sweep 9s cubic-bezier(.3,.05,.2,1) infinite;
  }

  @keyframes sweep{
    0%,74%{opacity:0;transform:translate3d(0,105vh,0)}
    75%{opacity:.9;transform:translate3d(-1.4%,90vh,0)}
    88%{opacity:.85;transform:translate3d(1.1%,26vh,0)}
    96%{opacity:.5;transform:translate3d(-.5%,-6vh,0)}
    97%,100%{opacity:0;transform:translate3d(0,-14vh,0)}
  }

  /* ---------- top bar ---------- */
  .bar{
    position:relative;
    z-index:6;
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    gap:16px;
    padding:22px clamp(20px,5vw,64px) 0;
    font-size:11px;
    letter-spacing:.22em;
    text-transform:uppercase;
  }

  .mark{color:var(--rust)}

  .right{
    display:flex;
    align-items:center;
    gap:14px;
  }

  .stat{
    color:var(--crt);
    text-align:right;
    font-variant-numeric:tabular-nums;
  }

  .snd{
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding:6px 11px;
    border:1px solid rgba(233,220,195,.26);
    background:rgba(11,20,24,.4);
    color:rgba(233,220,195,.8);
    font:inherit;
    font-size:10px;
    letter-spacing:.22em;
    text-transform:uppercase;
    cursor:pointer;
    transition:border-color .18s ease, color .18s ease;
  }

  .snd:hover{border-color:var(--rust);color:var(--cream)}
  .snd:focus-visible{outline:2px solid var(--crt);outline-offset:3px}

  .dot{
    width:6px;
    height:6px;
    background:rgba(233,220,195,.35);
    flex:none;
  }

  .snd[aria-pressed="true"]{
    border-color:var(--rust);
    color:var(--cream);
  }

  .snd[aria-pressed="true"] .dot{
    background:var(--rust);
    animation:blip 1.6s steps(1,end) infinite;
  }

  @keyframes blip{
    0%,60%{opacity:1}
    61%,100%{opacity:.15}
  }

  .stat b{
    font-weight:500;
    color:var(--cream);
  }

  /* ---------- lede ---------- */
  .lede{
    position:relative;
    z-index:6;
    align-self:end;
    padding:0 clamp(20px,5vw,64px);
    max-width:44ch;
  }

  .eyebrow{
    font-size:11px;
    letter-spacing:.3em;
    text-transform:uppercase;
    color:var(--crt);
    opacity:.75;
    margin-bottom:14px;
  }

  .title{
    position:relative;
    font-family:var(--display);
    font-weight:400;
    font-size:clamp(3.2rem,13vw,8.5rem);
    line-height:.82;
    letter-spacing:.005em;
    text-transform:uppercase;
    color:var(--cream);
  }

  .title::before,
  .title::after{
    content:attr(data-text);
    position:absolute;
    left:0;
    top:0;
    width:100%;
    opacity:0;
    pointer-events:none;
  }

  .title::before{color:var(--rust);animation:ghostA 9s linear infinite}
  .title::after{color:var(--crt);animation:ghostB 9s linear infinite}

  @keyframes ghostA{
    0%,85%{opacity:0;transform:translate(0,0)}
    87%{opacity:.85;transform:translate(-5px,2px)}
    90%{opacity:.5;transform:translate(3px,-1px)}
    92%,100%{opacity:0;transform:translate(0,0)}
  }

  @keyframes ghostB{
    0%,85%{opacity:0;transform:translate(0,0)}
    87%{opacity:.7;transform:translate(5px,-2px)}
    90%{opacity:.4;transform:translate(-3px,1px)}
    92%,100%{opacity:0;transform:translate(0,0)}
  }

  .sub{
    margin-top:20px;
    font-size:clamp(13px,1.6vw,15px);
    line-height:1.65;
    color:rgba(233,220,195,.72);
  }

  .links{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin-top:26px;
  }

  .links a{
    display:inline-block;
    padding:9px 16px;
    border:1px solid rgba(233,220,195,.28);
    color:var(--cream);
    text-decoration:none;
    font-size:11px;
    letter-spacing:.2em;
    text-transform:uppercase;
    background:rgba(11,20,24,.35);
    transition:background .18s ease, border-color .18s ease, color .18s ease;
  }

  .links a:hover,
  .links a:focus-visible{
    background:var(--rust);
    border-color:var(--rust);
    color:#0B1418;
  }

  .links a:focus-visible{outline:2px solid var(--crt);outline-offset:3px}

  /* ---------- foot ---------- */
  .foot{
    position:relative;
    z-index:6;
    display:flex;
    justify-content:space-between;
    gap:16px;
    padding:0 clamp(20px,5vw,64px) 22px;
    margin-top:36px;
    font-size:10px;
    letter-spacing:.2em;
    text-transform:uppercase;
    color:rgba(233,220,195,.42);
  }

  @media (max-width:640px){
    .foot span:last-child{display:none}
    .lede{max-width:none}
  }

  @media (prefers-reduced-motion:reduce){
    .grain,.track,.title::before,.title::after{animation:none}
    .track{opacity:0}
  }
</style>
</head>

  <main class="lede">
    <p class="eyebrow">Open 10:00 &ndash; 21:00, every day</p>
    <h1 class="title" data-text="Last Return">Last Return</h1>
    <p class="sub">The counter is unattended, the fluorescents are half out, and the tape in the deck is still running. Come in, take your time, put it back where you found it.</p>

    <span>Est. 1994</span>
    <span>Be kind &mdash; rewind</span>

</div>

<script>
  (function () {
    var OPEN = 10;   // opening hour, 24h
    var CLOSE = 21;  // closing hour, 24h
    var el = document.getElementById('stat');

    function pad(n) { return n < 10 ? '0' + n : '' + n; }

    function tick() {
      var now = new Date();
      var h = now.getHours();
      var target = new Date(now);
      var label;

      if (h >= OPEN && h < CLOSE) {
        target.setHours(CLOSE, 0, 0, 0);
        label = 'Closing in';
      } else {
        target.setHours(OPEN, 0, 0, 0);
        if (h >= CLOSE) target.setDate(target.getDate() + 1);
        label = 'Opening in';
      }

      var diff = Math.max(0, target - now);
      var hrs = Math.floor(diff / 3600000);
      var min = Math.floor((diff % 3600000) / 60000);
      var sec = Math.floor((diff % 60000) / 1000);

      el.innerHTML = label + ' <b>' + pad(hrs) + ':' + pad(min) + ':' + pad(sec) + '</b>';
    }

    tick();
    setInterval(tick, 1000);
  })();

  (function () {
    var tape = document.getElementById('tape');
    var btn = document.getElementById('snd');
    var label = document.getElementById('sndLabel');
    var PEAK = 0.65;      // final volume
    var FADE = 1800;      // fade length in ms
    var timer = null;

    tape.volume = 0;

    function fade(to, done) {
      clearInterval(timer);
      var from = tape.volume;
      var t0 = Date.now();
      timer = setInterval(function () {
        var p = Math.min(1, (Date.now() - t0) / FADE);
        tape.volume = Math.max(0, Math.min(1, from + (to - from) * p));
        if (p === 1) {
          clearInterval(timer);
          if (done) done();
        }
      }, 40);
    }

    function setState(on) {
      btn.setAttribute('aria-pressed', on ? 'true' : 'false');
      label.textContent = on ? 'Sound on' : 'Sound off';
    }

    btn.addEventListener('click', function () {
      var on = btn.getAttribute('aria-pressed') === 'true';
      if (on) {
        fade(0, function () { tape.pause(); });
        setState(false);
      } else {
        var p = tape.play();
        if (p && p.catch) {
          p.then(function () { setState(true); fade(PEAK); })
           .catch(function () { setState(false); });
        } else {
          setState(true);
          fade(PEAK);
        }
      }
    });
  })();
</script>
